[package]
name = "taiq"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/taiq/mod.rs"

[dependencies]
adk-rust = { version = "2.3.0", default-features = false, features = ["gemini", "openai", "openrouter", "anthropic", "ollama", "minimal", "tools"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "net", "sync", "time"] }
dotenvy = "0.15"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
adk-tool = "2.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
crossterm = { version = "0.29", optional = true }
futures = "0.3"
schemars = "1"
regex = "1"
glob = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
opendal = { version = "0.59", default-features = false, features = ["services-s3", "services-gcs", "services-azblob", "services-webdav"] }
async-trait = "0.1"
portable-pty = { version = "0.9", optional = true }
resvg = { version = "0.45", default-features = false, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_UI_Input_KeyboardAndMouse"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"], optional = true }
egui_extras = { version = "0.37", default-features = false, features = ["svg", "image"], optional = true }
gpui = { package = "gpui-ce", version = "0.3", optional = true }
gpui_platform = { package = "gpui_ce_platform", version = "0.3", optional = true }
gpui_ce_elements = { version = "0.3", optional = true }
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"], optional = true }

[features]
default = []
terminal-ui = ["dep:crossterm"]
desktop-admin = ["dep:portable-pty", "dep:resvg"]
desktop-egui = ["desktop-admin", "dep:eframe", "dep:egui_extras", "dep:rfd"]
desktop-gpui = ["desktop-admin", "dep:gpui", "dep:gpui_platform", "dep:gpui_ce_elements", "dep:rfd"]

[[bin]]
name = "taiq-agent"
path = "src/main.rs"

[[bin]]
name = "taiq"
path = "src/bin/taiq-tui.rs"
required-features = ["terminal-ui"]

[[bin]]
name = "taiq-egui"
path = "src/bin/taiq-egui.rs"
required-features = ["desktop-egui"]

[[bin]]
name = "taiq-gpui"
path = "src/bin/taiq-gpui.rs"
required-features = ["desktop-gpui"]
